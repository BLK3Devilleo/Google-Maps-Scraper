<tr>
    <td style="font-family: monospace; font-size: 12px; color: var(--color-text-dim);">{{.ID}}</td>
    <td style="font-weight: 600;">{{.Name}}</td>
    <td style="color: var(--color-text-dim);">{{.Date}}</td>
    <td>
        <span class="status-indicator status-{{.Status}}">
            {{ if eq .Status "working" }}
            EXTRAYENDO...
            {{ else if eq .Status "ok" }}
            COMPLETADO
            {{ else if eq .Status "pending" }}
            EN COLA
            {{ else if eq .Status "failed" }}
            FALLIDO
            {{ else }}
            {{.Status}}
            {{ end }}
        </span>
    </td>
    <td class="actions-cell">
        {{ if eq .Status "ok" }}
        <a href="/download?id={{.ID}}" download class="btn-action download-button">Descargar CSV</a>
        {{ end }}
        <button hx-delete="/delete?id={{.ID}}" hx-target="closest tr" hx-swap="outerHTML"
            hx-confirm="¿Estás seguro de que quieres eliminar este trabajo?"
            class="btn-action delete-button">Eliminar</button>
    </td>
</tr>
