<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Lead Scraper | Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.6/htmx.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header>
            <h1 style="font-family: 'Outfit', sans-serif;">Google Maps Lead Scraper</h1>
            <nav>
                <a href="/api/docs" target="_blank" rel="noopener noreferrer">Documentación API</a>
            </nav>
        </header>
        <main>
            <div class="sidebar">
                <div id="error-container" class="error-message"></div>
                <form hx-post="/scrape" hx-target="#job-table tbody" hx-swap="beforeend" hx-indicator="#spinner"
                    hx-on::before-request="document.getElementById('error-container').innerHTML = ''"
                    hx-on::after-request="if(!event.detail.successful) document.getElementById('error-container').innerHTML = event.detail.xhr.responseText">

                    <fieldset>
                        <legend>Configuración del Trabajo</legend>
                        <div class="form-group">
                            <label for="name">Nombre del Trabajo:</label>
                            <input type="text" id="name" name="name" value="{{.Name}}"
                                placeholder="Ej: Spas Madrid 30km">
                        </div>
                        <div class="form-group">
                            <label for="keywords">Palabras Clave (una por línea):</label>
                            <textarea id="keywords" name="keywords" rows="6"
                                placeholder="Ej: Spa&#10;Gimnasio&#10;Salón de belleza">{{ .KeywordsString }}</textarea>
                        </div>
                        <div class="form-group">
                            <label for="lang">Idioma (Código de 2 letras):</label>
                            <input type="text" id="lang" name="lang" value="{{.Language}}">
                        </div>
                    </fieldset>

                    <details class="expandable-section">
                        <summary>Ajustes Geográficos (Ubicación)</summary>
                        <fieldset>
                            <div class="form-group">
                                <label for="zoom">Zoom (Nivel 0-21):</label>
                                <input type="number" id="zoom" name="zoom" value="{{.Zoom}}">
                            </div>
                            <div class="form-group">
                                <label for="latitude">Latitud:</label>
                                <input type="number" step="0.000000000000001" id="latitude" name="latitude"
                                    value="{{.Lat}}" placeholder="Ej: 40.4168">
                            </div>
                            <div class="form-group">
                                <label for="longitude">Longitud:</label>
                                <input type="number" step="0.000000000000001" id="longitude" name="longitude"
                                    value="{{.Lon}}" placeholder="Ej: -3.7038">
                            </div>
                        </fieldset>
                    </details>

                    <details class="expandable-section">
                        <summary>Opciones Avanzadas</summary>
                        <fieldset>
                            <div class="form-group">
                                <label for="radius">Radio de Búsqueda (Metros):</label>
                                <input type="number" id="radius" name="radius" value="{{.Radius}}"
                                    placeholder="30000 para 30km">
                            </div>
                            <div class="form-group checkbox-container">
                                <label for="fastmode" style="display: inline-block; margin-bottom: 0;">Modo Rápido (Top
                                    20):</label>
                                <input type="checkbox" id="fastmode" name="fastmode" {{if .FastMode}}checked{{end}}>
                            </div>
                            <div class="form-group">
                                <label for="depth">Profundidad de Scroll:</label>
                                <input type="number" step="1" id="depth" name="depth" value="{{.Depth}}">
                            </div>
                            <div class="form-group checkbox-container">
                                <label for="email" style="display: inline-block; margin-bottom: 0;">Extraer Emails
                                    (Webs):</label>
                                <input type="checkbox" id="email" name="email" {{if .Email}}checked{{end}}>
                            </div>
                            <div class="form-group checkbox-container">
                                <label for="social" style="display: inline-block; margin-bottom: 0;">Extraer Redes
                                    Sociales
                                    (Webs):</label>
                                <input type="checkbox" id="social" name="social" {{if .Social}}checked{{end}}>
                            </div>
                            <div class="form-group">
                                <label for="maxtime">Tiempo Máximo (Ej: 15m):</label>
                                <input type="text" id="maxtime" name="maxtime" value="{{.MaxTime}}">
                            </div>
                        </fieldset>
                    </details>

                    <details class="expandable-section">
                        <summary>Configurar Proxies</summary>
                        <fieldset>
                            <div class="form-group">
                                <label for="proxies">Lista de Proxies (uno por línea):</label>
                                <p style="font-size: 11px; color: var(--color-text-dim); margin-bottom: 10px;">
                                    Formatos compatibles: http, https, socks5.<br>
                                    Ej: socks5://usuario:password@host:port
                                </p>
                                <textarea id="proxies" name="proxies" rows="4">{{.ProxiesString}}</textarea>
                            </div>
                        </fieldset>
                    </details>

                    <button type="submit">Iniciar Extracción 🚀</button>
                </form>
            </div>
            <div class="content">
                <div id="spinner" class="spinner"></div>
                <table id="job-table">
                    <thead>
                        <tr>
                            <th>ID del Trabajo</th>
                            <th>Nombre</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody hx-get="/jobs" hx-trigger="load, every 10s">
                        <!-- Las filas de trabajo se insertan aquí vía HTMX -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para el Visor de Leads -->
    <div id="results-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Resultados de Extracción</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <table class="results-table">
                    <thead id="results-thead"></thead>
                    <tbody id="results-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function fetchLocations() {
            fetch('/api/locations')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('location-presets');
                    select.innerHTML = '<option value="">-- Mis Ubicaciones --</option>';
                    data.forEach(loc => {
                        const opt = document.createElement('option');
                        opt.value = JSON.stringify(loc);
                        opt.innerText = loc.path;
                        select.appendChild(opt);
                    });
                });
        }

        function saveCurrentLocation() {
            const path = document.getElementById('new-location-name').value;
            const lat = document.getElementById('latitude').value;
            const lon = document.getElementById('longitude').value;

            if (!path || !lat || !lon) {
                alert('Por favor, introduce un nombre y coordenadas válidas.');
                return;
            }

            fetch('/api/locations', {
                method: 'POST',
                body: JSON.stringify({ path, lat, lon })
            }).then(() => {
                document.getElementById('new-location-name').value = '';
                fetchLocations();
            });
        }

        function loadPreset() {
            const val = document.getElementById('location-presets').value;
            if (!val) return;
            const loc = JSON.parse(val);
            document.getElementById('latitude').value = loc.lat;
            document.getElementById('longitude').value = loc.lon;
        }

        function viewResults(id, name) {
            document.getElementById('modal-title').innerText = `Leads: ${name}`;
            const tbody = document.getElementById('results-tbody');
            const thead = document.getElementById('results-thead');
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 40px;">Cargando leads...</td></tr>';
            thead.innerHTML = '';

            document.getElementById('results-modal').style.display = 'flex';

            fetch(`/jobs/results?id=${id}`)
                .then(response => response.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 40px;">No hay resultados todavía.</td></tr>';
                        return;
                    }

                    // Headers
                    const headers = Object.keys(data[0]);
                    let headHtml = '<tr>';
                    const mainHeaders = ['title', 'review_rating', 'category', 'phone', 'website', 'emails', 'socials'];
                    mainHeaders.forEach(h => {
                        const label = h === 'review_rating' ? 'Puntuación' :
                            h === 'socials' ? 'Redes' : h.toUpperCase();
                        headHtml += `<th>${label}</th>`;
                    });
                    headHtml += '</tr>';
                    thead.innerHTML = headHtml;

                    // Rows
                    let bodyHtml = '';
                    data.forEach(row => {
                        bodyHtml += '<tr>';
                        mainHeaders.forEach(h => {
                            let value = row[h] || '-';
                            if (h === 'review_rating') {
                                const rating = parseFloat(value) || 0;
                                value = `<span style="color: var(--color-primary);">⭐ ${rating.toFixed(1)}</span>`;
                            } else if (h === 'socials') {
                                let socialsHtml = '';
                                if (value && value !== '-') {
                                    try {
                                        const socials = JSON.parse(value);
                                        Object.entries(socials).forEach(([p, link]) => {
                                            socialsHtml += `<a href="${link}" target="_blank" title="${p}" style="margin-right:8px; font-size:16px;">${getSocialIcon(p)}</a>`;
                                        });
                                    } catch (e) { }
                                }
                                value = socialsHtml || '-';
                            } else if (h === 'website' && value !== '-') {
                                value = `<a href="${value}" target="_blank" style="color: var(--color-accent);">Visitar Website</a>`;
                            }
                            bodyHtml += `<td>${value}</td>`;
                        });
                        bodyHtml += '</tr>';
                    });
                    tbody.innerHTML = bodyHtml;
                })
                .catch(err => {
                    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 40px; color: var(--color-error);">Error al cargar los datos: ${err}</td></tr>`;
                });
        }

        function getSocialIcon(platform) {
            const icons = {
                'facebook': '🔵',
                'instagram': '📸',
                'twitter': '🐦',
                'linkedin': '🔗',
                'youtube': '📺',
                'tiktok': '🎵'
            };
            return icons[platform] || '🌐';
        }

        function closeModal() {
            document.getElementById('results-modal').style.display = 'none';
        }

        function updateTimers() {
            const now = Math.floor(Date.now() / 1000);
            document.querySelectorAll('.countdown').forEach(el => {
                const start = parseInt(el.getAttribute('data-start'));
                const duration = parseInt(el.getAttribute('data-duration'));
                const end = start + duration;
                const remaining = end - now;

                if (remaining <= 0) {
                    el.innerText = "Finalizado (Procesando...)";
                } else {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    el.innerText = `Falta aprox: ${mins}m ${secs}s`;
                }
            });
        }

        setInterval(updateTimers, 1000);
        fetchLocations();
    </script>
</body>

</html>
