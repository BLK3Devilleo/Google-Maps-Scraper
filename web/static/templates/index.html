<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Lead Scraper | Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.6/htmx.min.js"></script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .job-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-premium);
        }

        .job-card:hover {
            transform: translateY(-5px);
            border-color: var(--color-primary);
            background: rgba(255, 255, 255, 0.02);
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .job-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 5px;
        }

        .job-card-date {
            font-size: 12px;
            color: var(--color-text-dim);
        }

        .job-card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--color-border);
            padding-top: 15px;
        }

        .job-type-badge {
            font-size: 10px;
            text-transform: uppercase;
            padding: 3px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            color: var(--color-text-dim);
        }

        .btn-manage {
            background: linear-gradient(135deg, var(--color-primary), #d97706);
            color: #000;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
    <style>
        :root {
            --color-background: #0f172a;
            --color-surface: #1e293b;
            --color-surface-hover: #334155;
            --color-text: #f1f5f9;
            --color-text-dim: #94a3b8;
            --color-border: #334155;
            --color-primary: #f59e0b;
            --color-primary-hover: #fbbf24;
            --color-accent: #38bdf8;
            --color-success: #10b981;
            --color-error: #ef4444;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-premium: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body {
            background-color: var(--color-background);
            background-image: radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.05) 0px, transparent 50%);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        .app-container { max-width: 1600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--glass-bg); backdrop-filter: blur(12px); padding: 20px 40px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; background: linear-gradient(to right, var(--color-primary), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav a { color: var(--color-text); text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; transition: all 0.2s; }
        nav a:hover { border-color: var(--color-primary); transform: translateY(-1px); }
        main { display: flex; flex: 1; padding: 20px; gap: 20px; }
        .sidebar { width: 380px; background: var(--color-surface); padding: 25px; border-radius: 16px; border: 1px solid var(--color-border); }
        .content { flex: 1; background: var(--color-surface); border-radius: 16px; border: 1px solid var(--color-border); padding: 25px; }
        button { cursor: pointer; transition: all 0.2s; }
        input, textarea, select { background: var(--color-background); border: 1px solid var(--color-border); color: white; padding: 10px; border-radius: 8px; width: 100%; }
        .tab-btn { background: none; border: none; padding: 10px; cursor: pointer; font-weight: bold; color: var(--color-text-dim); }
        .tab-btn.active { color: var(--color-primary); border-bottom: 2px solid var(--color-primary); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; color: var(--color-text-dim); border-bottom: 1px solid var(--color-border); font-size: 12px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--color-border); font-size: 14px; }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
            <h1 style="font-family: 'Outfit', sans-serif;">Google Maps Lead Scraper</h1>
            <nav>
                <a href="/explorer" style="margin-right: 15px; color: var(--color-accent); font-weight: 600;">Explorador de Webs</a>
                <a href="/api/docs" target="_blank" rel="noopener noreferrer">Documentación API</a>
            </nav>
        </header>
        <main>
            <div class="sidebar">
                <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px;">
                    <button class="tab-btn active" onclick="switchTab('maps')" style="background: none; border: none; color: var(--color-primary); cursor: pointer; font-weight: 700; padding: 5px 10px;">Google Maps</button>
                    <button class="tab-btn" onclick="switchTab('web')" style="background: none; border: none; color: var(--color-text-dim); cursor: pointer; font-weight: 700; padding: 5px 10px;">Web Inspector</button>
                </div>

                <div id="maps-form-container">
                    <div id="error-container" class="error-message"></div>
                    <form hx-post="/scrape" hx-target="#job-grid" hx-swap="afterbegin" hx-indicator="#spinner"
                        hx-on::before-request="document.getElementById('error-container').innerHTML = ''"
                        hx-on::after-request="if(!event.detail.successful) document.getElementById('error-container').innerHTML = event.detail.xhr.responseText">

                    <fieldset>
                        <legend>Configuración del Trabajo</legend>
                        <div class="form-group">
                            <label for="name">Nombre del Trabajo:</label>
                            <input type="text" id="name" name="name" value="{{.Name}}"
                                placeholder="Ej: Spas Madrid 30km">
                        </div>
                        <div class="form-group">
                            <label for="keywords">Palabras Clave (una por línea):</label>
                            <textarea id="keywords" name="keywords" rows="6"
                                placeholder="Ej: Spa&#10;Gimnasio&#10;Salón de belleza">{{ .KeywordsString }}</textarea>
                        </div>
                        <div class="form-group">
                            <label for="lang">Idioma (Código de 2 letras):</label>
                            <input type="text" id="lang" name="lang" value="{{.Language}}">
                        </div>
                    </fieldset>

                    <details class="expandable-section">
                        <summary>Ajustes Geográficos (Ubicación)</summary>
                        <fieldset>
                            <div class="form-group">
                                <label for="location-presets">Mis Ubicaciones Guardadas:</label>
                                <select id="location-presets" onchange="loadPreset()"
                                    style="width: 100%; padding: 12px; border-radius: 10px; background: var(--color-background); color: white; border: 1px solid var(--color-border);">
                                    <option value="">-- Seleccionar --</option>
                                </select>
                            </div>

                            <div style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px;">
                                <div style="flex: 1;">
                                    <label for="new-location-name" style="font-size: 11px;">Guardar como (ej:
                                        Valencia/Centro):</label>
                                    <input type="text" id="new-location-name" placeholder="Nombre de ubicación">
                                </div>
                                <button type="button" onclick="saveCurrentLocation()" class="btn-action"
                                    style="background: var(--color-accent); color: #000; height: 46px; white-space: nowrap; font-size: 11px;">Guardar
                                    💾</button>
                            </div>

                            <div class="form-group">
                                <label for="zoom">Zoom (Nivel 0-21):</label>
                                <input type="number" id="zoom" name="zoom" value="{{.Zoom}}">
                            </div>
                            <div class="form-group">
                                <label for="latitude">Latitud:</label>
                                <input type="number" step="0.000000000000001" id="latitude" name="latitude"
                                    value="{{.Lat}}" placeholder="Ej: 40.4168">
                            </div>
                            <div class="form-group">
                                <label for="longitude">Longitud:</label>
                                <input type="number" step="0.000000000000001" id="longitude" name="longitude"
                                    value="{{.Lon}}" placeholder="Ej: -3.7038">
                            </div>
                        </fieldset>
                    </details>

                    <details class="expandable-section">
                        <summary>Opciones Avanzadas</summary>
                        <fieldset>
                            <div class="form-group">
                                <label for="radius">Radio de Búsqueda (Metros):</label>
                                <input type="number" id="radius" name="radius" value="{{.Radius}}"
                                    placeholder="30000 para 30km">
                            </div>
                            <div class="form-group checkbox-container">
                                <label for="fastmode" style="display: inline-block; margin-bottom: 0;">Modo Rápido (Top
                                    20):</label>
                                <input type="checkbox" id="fastmode" name="fastmode" {{if .FastMode}}checked{{end}}>
                            </div>
                            <div class="form-group">
                                <label for="depth">Profundidad de Scroll:</label>
                                <input type="number" step="1" id="depth" name="depth" value="{{.Depth}}">
                            </div>
                            <div class="form-group checkbox-container">
                                <label for="email" style="display: inline-block; margin-bottom: 0;">Extraer Emails
                                    (Webs):</label>
                                <input type="checkbox" id="email" name="email" {{if .Email}}checked{{end}}>
                            </div>
                            <div class="form-group checkbox-container">
                                <label for="social" style="display: inline-block; margin-bottom: 0;">Extraer Redes
                                    Sociales
                                    (Webs):</label>
                                <input type="checkbox" id="social" name="social" {{if .Social}}checked{{end}}>
                            </div>
                            <div class="form-group">
                                <label for="maxtime">Tiempo Máximo (Ej: 15m):</label>
                                <input type="text" id="maxtime" name="maxtime" value="{{.MaxTime}}">
                            </div>
                        </fieldset>
                    </details>

                    <details class="expandable-section">
                        <summary>Configurar Proxies</summary>
                        <fieldset>
                            <div class="form-group">
                                <label for="proxies">Lista de Proxies (uno por línea):</label>
                                <p style="font-size: 11px; color: var(--color-text-dim); margin-bottom: 10px;">
                                    Formatos compatibles: http, https, socks5.<br>
                                    Ej: socks5://usuario:password@host:port
                                </p>
                                <textarea id="proxies" name="proxies" rows="4">{{.ProxiesString}}</textarea>
                            </div>
                        </fieldset>
                    </details>

                    <button type="submit">Iniciar Extracción 🚀</button>
                </form>
                </div>

                <div id="web-form-container" style="display: none;">
                    <div id="web-error-container" class="error-message"></div>
                    <form hx-post="/web-scrape" hx-target="#job-grid" hx-swap="afterbegin" hx-indicator="#spinner"
                        hx-on::before-request="document.getElementById('web-error-container').innerHTML = ''"
                        hx-on::after-request="if(!event.detail.successful) document.getElementById('web-error-container').innerHTML = event.detail.xhr.responseText">
                        
                        <fieldset>
                            <legend>Web Deep Inspector</legend>
                            <div class="form-group">
                                <label for="web-name">Nombre del Proyecto:</label>
                                <input type="text" id="web-name" name="name" placeholder="Ej: Análisis Competencia Enero">
                            </div>
                            <div class="form-group">
                                <label for="urls">URLs a inspeccionar (una por línea):</label>
                                <textarea id="urls" name="urls" rows="10" placeholder="https://example.com&#10;https://anothersite.org"></textarea>
                            </div>
                        </fieldset>
                        
                        <button type="submit" style="background: linear-gradient(135deg, var(--color-accent), #0284c7);">Iniciar Inspección Profunda 🔍</button>
                    </form>
                </div>
            </div>
            <div class="content">
                <div id="spinner" class="spinner"></div>
                <div class="dashboard-grid" id="job-grid" hx-get="/jobs" hx-trigger="load, every 10s">
                    <!-- Los paquetes de datos se insertan aquí vía HTMX -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para el Visor de Leads -->
    <div id="results-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Resultados de Extracción</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <table class="results-table">
                    <thead id="results-thead"></thead>
                    <tbody id="results-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const mapsContainer = document.getElementById('maps-form-container');
            const webContainer = document.getElementById('web-form-container');
            const btns = document.querySelectorAll('.tab-btn');
            
            if (tab === 'maps') {
                mapsContainer.style.display = 'block';
                webContainer.style.display = 'none';
                btns[0].style.color = 'var(--color-primary)';
                btns[1].style.color = 'var(--color-text-dim)';
            } else {
                mapsContainer.style.display = 'none';
                webContainer.style.display = 'block';
                btns[0].style.color = 'var(--color-text-dim)';
                btns[1].style.color = 'var(--color-accent)';
            }
        }
        function fetchLocations() {
            fetch('/api/locations')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('location-presets');
                    select.innerHTML = '<option value="">-- Mis Ubicaciones --</option>';
                    data.forEach(loc => {
                        const opt = document.createElement('option');
                        opt.value = JSON.stringify(loc);
                        opt.innerText = loc.path;
                        select.appendChild(opt);
                    });
                });
        }

        function saveCurrentLocation() {
            const path = document.getElementById('new-location-name').value;
            const lat = document.getElementById('latitude').value;
            const lon = document.getElementById('longitude').value;

            if (!path || !lat || !lon) {
                alert('Por favor, introduce un nombre y coordenadas válidas.');
                return;
            }

            fetch('/api/locations', {
                method: 'POST',
                body: JSON.stringify({ path, lat, lon })
            }).then(() => {
                document.getElementById('new-location-name').value = '';
                fetchLocations();
            });
        }

        function loadPreset() {
            const val = document.getElementById('location-presets').value;
            if (!val) return;
            const loc = JSON.parse(val);
            document.getElementById('latitude').value = loc.lat;
            document.getElementById('longitude').value = loc.lon;
        }

        function viewResults(id, name, type) {
            document.getElementById('modal-title').innerText = `${type === 'web' ? 'Inspección' : 'Leads'}: ${name}`;
            const tbody = document.getElementById('results-tbody');
            const thead = document.getElementById('results-thead');
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 40px;">Cargando resultados...</td></tr>';
            thead.innerHTML = '';

            document.getElementById('results-modal').style.display = 'flex';

            fetch(`/jobs/results?id=${id}`)
                .then(response => response.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 40px;">No hay resultados todavía.</td></tr>';
                        return;
                    }

                    // Headers
                    let headHtml = '<tr>';
                    let mainHeaders = [];
                    
                    if (type === 'web') {
                        mainHeaders = ['url', 'title', 'summary', 'images', 'videos', 'emails', 'socials'];
                    } else {
                        mainHeaders = ['title', 'review_rating', 'category', 'phone', 'website', 'emails', 'socials'];
                    }

                    mainHeaders.forEach(h => {
                        let label = h.toUpperCase();
                        if (h === 'review_rating') label = '⭐';
                        if (h === 'socials') label = 'REDES';
                        if (h === 'summary') label = 'RESUMEN';
                        if (h === 'images') label = '📸';
                        if (h === 'videos') label = '🎥';
                        headHtml += `<th>${label}</th>`;
                    });
                    headHtml += '</tr>';
                    thead.innerHTML = headHtml;

                    // Rows
                    let bodyHtml = '';
                    data.forEach(row => {
                        bodyHtml += '<tr>';
                        mainHeaders.forEach(h => {
                            let value = row[h] || '-';
                            if (h === 'review_rating') {
                                const rating = parseFloat(value) || 0;
                                value = `<span style="color: var(--color-primary);">⭐ ${rating.toFixed(1)}</span>`;
                            } else if (h === 'socials') {
                                let socialsHtml = '';
                                if (value && value !== '-') {
                                    try {
                                        const socials = JSON.parse(value);
                                        Object.entries(socials).forEach(([p, link]) => {
                                            socialsHtml += `<a href="${link}" target="_blank" title="${p}" style="margin-right:8px; font-size:16px;">${getSocialIcon(p)}</a>`;
                                        });
                                    } catch (e) { }
                                }
                                value = socialsHtml || '-';
                            } else if (h === 'website' || h === 'url') {
                                if (value !== '-') {
                                    value = `<a href="${value}" target="_blank" style="color: var(--color-accent); text-decoration: underline;">${value}</a>`;
                                }
                            } else if (h === 'images' || h === 'videos') {
                                if (value !== '-') {
                                    const items = value.split(' | ');
                                    value = `<span title="${value}">${items.length} elementos</span>`;
                                }
                            } else if (h === 'summary') {
                                value = `<div style="max-width: 200px; white-space: normal; font-size: 11px;">${value}</div>`;
                            }
                            bodyHtml += `<td>${value}</td>`;
                        });
                        bodyHtml += '</tr>';
                    });
                    tbody.innerHTML = bodyHtml;
                })
                .catch(err => {
                    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 40px; color: var(--color-error);">Error al cargar los datos: ${err}</td></tr>`;
                });
        }

        function getSocialIcon(platform) {
            const icons = {
                'facebook': '🔵',
                'instagram': '📸',
                'twitter': '🐦',
                'linkedin': '🔗',
                'youtube': '📺',
                'tiktok': '🎵'
            };
            return icons[platform] || '🌐';
        }

        function closeModal() {
            document.getElementById('results-modal').style.display = 'none';
        }

        function updateTimers() {
            const now = Math.floor(Date.now() / 1000);
            document.querySelectorAll('.countdown').forEach(el => {
                const start = parseInt(el.getAttribute('data-start'));
                const duration = parseInt(el.getAttribute('data-duration'));
                const end = start + duration;
                const remaining = end - now;

                if (remaining <= 0) {
                    el.innerText = "Finalizado (Procesando...)";
                } else {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    el.innerText = `Falta aprox: ${mins}m ${secs}s`;
                }
            });
        }

        setInterval(updateTimers, 1000);
        fetchLocations();
    </script>
</body>

</html>
